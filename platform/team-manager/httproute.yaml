apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-manager
  namespace: team-manager
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: alb
      namespace: gateway
      sectionName: https
  hostnames:
    - team.hackathon.pluvivanto.win
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: team-manager
          port: 80
          weight: 1
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: team-manager
  namespace: team-manager
spec:
  targetReference:
    name: team-manager
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /healthz

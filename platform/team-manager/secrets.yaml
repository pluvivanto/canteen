apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: team-manager-admin
  namespace: team-manager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  dataFrom:
    - extract:
        key: hackathon/team-manager-admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-masterkey
  namespace: team-manager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  dataFrom:
    - extract:
        key: hackathon/litellm-masterkey

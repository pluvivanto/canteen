apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-manager
  namespace: team-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: team-manager
  template:
    metadata:
      labels:
        app: team-manager
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: team-manager
          image: public.ecr.aws/t8f0j3e9/team-manager:80dc6bb6b4ffc729a0e25d8cc0164f3f90f069b7
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: team-manager-db.hackathon.internal
            - name: DB_NAME
              value: team_manager
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: team-manager-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team-manager-db
                  key: password
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: team-manager
  namespace: team-manager
spec:
  selector:
    app: team-manager
  ports:
    - name: http
      port: 80
      targetPort: http

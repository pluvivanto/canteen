apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/<owner>/canteen.git
    targetRevision: main
    path: platform/team-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: team-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

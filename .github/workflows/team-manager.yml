name: team-manager

on:
  push:
    branches: [main]
    paths:
      - services/team-manager/**
      - .github/workflows/team-manager.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  IMAGE: public.ecr.aws/t8f0j3e9/team-manager

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/team-manager
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/team-manager/go.mod
          cache-dependency-path: services/team-manager/go.sum

      - run: go test ./...

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - run: aws ecr-public get-login-password | docker login --username AWS --password-stdin public.ecr.aws

      - run: |
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: deploy
        working-directory: .
        run: |
          sed -i "s|image: $IMAGE:.*|image: $IMAGE:$GITHUB_SHA|" platform/team-manager/team-manager.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy team-manager ${GITHUB_SHA::7}"
          git pull --rebase
          git push
